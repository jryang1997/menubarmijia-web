    </text>

    <rect x="0" y="292" width="240" height="54" rx="27" fill="#007AFF" />
    <text x="42" y="326" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">

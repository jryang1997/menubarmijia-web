<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F8FC" />
      <stop offset="50%" stop-color="#E6F2FE" />
      <stop offset="100%" stop-color="#D8ECFD" />
    </linearGradient>
    <radialGradient id="sunOrb" cx="72%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#FDBA74" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="slider1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E28743" />
      <stop offset="100%" stop-color="#EE9B59" />
    </linearGradient>
    <linearGradient id="slider2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F09C4E" />
      <stop offset="50%" stop-color="#F8DFB6" />
      <stop offset="100%" stop-color="#9AD0F5" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="860" cy="300" r="340" fill="url(#sunOrb)" />

  <!-- Left Editorial Copy -->
